name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          # musl: static binaries that run on any Linux distribution.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="tabwire-${GITHUB_REF_NAME}-${{ matrix.target }}"
          dir="target/${{ matrix.target }}/release"
          mkdir "$name" && cp README.md "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$dir/tabwire.exe" "$name/" && 7z a -bso0 "$name.zip" "$name"
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp "$dir/tabwire" "$name/" && tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum * > SHA256SUMS
          cat > ../notes.md <<'NOTES'
          ## Install

          Download the file for your system, unpack it and put `tabwire` (`tabwire.exe` on Windows) on your `PATH`:

          | System | File |
          |---|---|
          | macOS, Apple Silicon | `aarch64-apple-darwin` |
          | macOS, Intel | `x86_64-apple-darwin` |
          | Linux, x86-64 (any distribution) | `x86_64-unknown-linux-musl` |
          | Linux, ARM64 (any distribution) | `aarch64-unknown-linux-musl` |
          | Windows, x86-64 | `x86_64-pc-windows-msvc` |

          Then run `tabwire doctor` to check your browser setup. `SHA256SUMS` has the checksums.
          NOTES
          sed -i 's/^          //' ../notes.md
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "tabwire $GITHUB_REF_NAME" --notes-file ../notes.md *
